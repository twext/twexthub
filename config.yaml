port: 3000
dataDir: ./data
apiRoot: /v0
publicBaseUrl: http://localhost:3000
requireHttps: false
database:
  url: postgres://postgres:postgres@localhost:5432/twexthub
  maxConnections: 10
auth:
  sessionTtlDays: 7
  scrypt: { N: 16384, r: 8, p: 1 }
rateLimits:
  loginAttemptsPerWindow: 5
  loginWindowMinutes: 15
  signupsPerIpPerWindow: 5
  signupWindowMinutes: 15
pagination:
  defaultLimit: 20
  maxLimit: 50
